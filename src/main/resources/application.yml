spring:
  application:
    name: hibernet-caching
  datasource:
    url: jdbc:postgresql://localhost:5432/UserService
    username: ecommerceUser
    password: user1234
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
          jcache.provider: org.ehcache.jsr107.EhcacheCachingProvider
    hibernate:
      ddl-auto: create

logging:
  level:
    org.hibernate.engine.spi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.internal: DEBUG
    org.hibernate.cache: DEBUG
    org.hibernate.cache.spi: DEBUG
